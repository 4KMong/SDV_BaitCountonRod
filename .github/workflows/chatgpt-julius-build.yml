name: Build patched Julius 1.8.0
on:
  push:
    branches:
      - chatgpt-julius-1.8-qol-build
jobs:
  build:
    runs-on: windows-latest
    env:
      SDL_VERSION: 2.32.8
      SDL_MIXER_VERSION: 2.8.1
      COMPILER: mingw-32
      SKIP_UPLOAD: true
    steps:
      - name: Checkout temporary patch branch
        uses: actions/checkout@v4
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw32
          location: D:\
          install: mingw-w64-i686-gcc
          update: true
      - name: Clone Augustus source for feature tracing
        shell: powershell
        run: git clone --depth 1 https://github.com/Keriew/augustus.git augustus
      - name: Trace Augustus implementations
        continue-on-error: true
        shell: powershell
        run: |
          python tools/trace_augustus.py augustus | Out-File -Encoding utf8 augustus-trace.txt
          if (Test-Path augustus-trace.txt) { Get-Content augustus-trace.txt }
      - name: Upload Augustus trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: augustus-source-trace
          path: augustus-trace.txt
          if-no-files-found: warn
      - name: Clone Julius 1.8.0
        shell: powershell
        run: git clone --depth 1 --branch v1.8.0 https://github.com/bvschaik/julius.git julius
      - name: Apply Julius patch
        shell: powershell
        run: python tools/apply_julius_patch.py julius
      - name: Make old Julius CMake compatible with current CMake
        shell: powershell
        working-directory: julius
        run: |
          $p = Get-Content CMakeLists.txt -Raw
          $p = $p.Replace('cmake_minimum_required(VERSION 3.1)', 'cmake_minimum_required(VERSION 3.5)')
          Set-Content CMakeLists.txt $p
      - name: Install SDL
        shell: powershell
        working-directory: julius
        run: ./.ci_scripts/install_sdl.ps1
      - name: Build Julius
        shell: powershell
        working-directory: julius
        run: ./.ci_scripts/run_build.ps1
      - name: Upload julius.exe
        uses: actions/upload-artifact@v4
        with:
          name: julius-patched-exe
          path: julius/build/julius.exe
          if-no-files-found: error
