name: Build patched Julius 1.8.0
on:
  push:
    branches:
      - chatgpt-julius-1.8-qol-build
jobs:
  build:
    runs-on: windows-latest
    env:
      SDL_VERSION: 2.32.8
      SDL_MIXER_VERSION: 2.8.1
      COMPILER: mingw-32
      SKIP_UPLOAD: true
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw32
          location: D:\
          install: mingw-w64-i686-gcc
          update: true
      - name: Clone Julius 1.8.0
        shell: powershell
        run: git clone --depth 1 --branch v1.8.0 https://github.com/bvschaik/julius.git julius
      - name: Create and apply patch
        shell: powershell
        run: |
          python -c "import base64,gzip; open('apply_patch.py','wb').write(gzip.decompress(base64.b64decode('')))"
          python apply_patch.py julius
      - name: Install SDL
        shell: powershell
        working-directory: julius
        run: ./.ci_scripts/install_sdl.ps1
      - name: Build Julius
        shell: powershell
        working-directory: julius
        run: ./.ci_scripts/run_build.ps1
      - name: Upload julius.exe
        uses: actions/upload-artifact@v4
        with:
          name: julius-patched-exe
          path: julius/build/julius.exe
          if-no-files-found: error
